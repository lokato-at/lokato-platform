name: Build 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: mbstring, pdo, mysql, bcmath
          tools: composer

      - name: Prepare Laravel writable dirs
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache storage
          chmod -R ug+rw bootstrap/cache storage

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle release artifact
        run: |
          tar czf lokato-release.tar.gz \
            backend \
            frontend \
            docker \
            docs \
            README.md
