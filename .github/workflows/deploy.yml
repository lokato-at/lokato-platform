name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: mbstring, pdo, mysql, bcmath
          tools: composer

      - name: Prepare Laravel writable dirs
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache storage
          chmod -R ug+rw bootstrap/cache storage

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle release artifact
        run: |
          tar czf lokato-release.tar.gz \
            backend \
            frontend \
            docker \
            docs \
            README.md

      - name: Upload artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "lokato-release.tar.gz"
          target: "${{ secrets.DEPLOY_PATH }}/releases"

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_BASE="${{ secrets.DEPLOY_PATH }}"
            RELEASE_NAME="$(date +%Y%m%d%H%M%S)"
            RELEASE_DIR="$DEPLOY_BASE/releases/$RELEASE_NAME"
            SHARED_ENV="$DEPLOY_BASE/shared/backend/.env"
            SHARED_STORAGE="$DEPLOY_BASE/shared/storage"

            mkdir -p "$RELEASE_DIR" "$DEPLOY_BASE/shared/backend" "$SHARED_STORAGE"

            tar xzf "$DEPLOY_BASE/releases/lokato-release.tar.gz" -C "$RELEASE_DIR"

            if [ -f "$SHARED_ENV" ]; then
              ln -sfn "$SHARED_ENV" "$RELEASE_DIR/backend/.env"
            fi

            rm -rf "$RELEASE_DIR/backend/storage"
            ln -sfn "$SHARED_STORAGE" "$RELEASE_DIR/backend/storage"

            cd "$RELEASE_DIR/backend"
            php artisan storage:link --force
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            ln -sfn "$RELEASE_DIR" "$DEPLOY_BASE/current"
