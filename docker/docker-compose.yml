services:
  db:
    image: mysql:8.0
    container_name: lokato-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: lokato_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      TZ: Europe/Vienna
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - lokato_db_data:/var/lib/mysql
      # All .sql/.sh files in this folder will be executed on first startup
      - ./sql/init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lokato-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: admin
      PMA_PASSWORD: admin
      PMA_ABSOLUTE_URI: http://localhost:8090/
    ports:
      - "8090:80"
    depends_on:
      - db

  mqtt:
    image: eclipse-mosquitto:2
    container_name: lokato-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  realtime:
    build:
      context: ../realtime
    container_name: lokato-realtime
    restart: unless-stopped
    env_file:
      - ../realtime/.env.example
    environment:
      DB_HOST: db
      MQTT_URL: mqtt://mqtt:1883
    ports:
      - "8081:8081"
    depends_on:
      - db
      - mqtt

volumes:
  lokato_db_data:
