# Lokato Mosquitto config for the Raspberry Pi (native apt install).
# Deployed to /etc/mosquitto/conf.d/lokato.conf by start-prod-raspi.sh.
#
# Minimal on purpose: the apt-shipped /etc/mosquitto/mosquitto.conf already
# defines persistence + persistence_location + log_dest with sensible Pi paths.
# Duplicating any of those here would crash mosquitto with
#   "Duplicate <key> value in configuration".
#
# So we only set what we genuinely need to override:
#   - allow_anonymous: Mosquitto 2.x defaults to FALSE; ESP32 scanners and
#     our laravel-subscriber both connect without credentials
#   - listener on 0.0.0.0: stock config binds to localhost only; ESP32
#     devices on the LAN need to reach us

allow_anonymous true
listener 1883 0.0.0.0
