# Lokato Dev nginx — same-origin reverse proxy
# Routing:
#   /         -> Vite-Dev-Server (Hot-Reload via `npm run dev` auf dem Host)
#   /api/*    -> Laravel via php-fpm (FastCGI auf php-fpm:9000)
#
# SSE-Pfade laufen ueber /api/stream und gehen damit auch durch php-fpm.
# Buffering ist global aus, das gilt fuer normale REST-Calls genauso wie
# fuer SSE — Mehr-Overhead ist vernachlaessigbar, dafuer keine Sonderfaelle.

upstream lokato_vite_dev {
    # Vite-Dev laeuft auf dem Host (Win11 / WSL2). Wenn Vite nicht laeuft,
    # bekommst du hier 502 — dann im frontend/-Verzeichnis `npm run dev` starten.
    server host.docker.internal:5173;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8m;

    # Laravel-API: alle /api/*-Pfade an Laravels Front-Controller.
    location /api {
        try_files $uri /index.php?$query_string;
    }

    # Alles andere -> Vite-Dev. WebSocket-Upgrade fuer HMR.
    location / {
        proxy_pass         http://lokato_vite_dev;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~ \.php$ {
        fastcgi_pass   php-fpm:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        include        fastcgi_params;

        # SSE: kein Buffering, kein chunked-Encoding-Aufschub durch nginx.
        fastcgi_buffering         off;
        fastcgi_request_buffering off;
        fastcgi_read_timeout      75s;
    }

    # Kein "location ~ /\." Deny-Block hier:
    # In Dev werden statische Files NICHT direkt von nginx geliefert (alles geht
    # zu Vite oder php-fpm), und der Block wuerde Vite-Optimierungspfade wie
    # /node_modules/.vite/deps/ blockieren. In prod.conf bleibt er bestehen.
}
