# Lokato Raspberry Pi Production vhost.
# Deployment-Pfad: /etc/nginx/sites-available/lokato
# Aktivieren:     ln -s /etc/nginx/sites-available/lokato /etc/nginx/sites-enabled/lokato
#
# Verzeichnis-Layout auf dem Pi:
#   /var/www/lokato/frontend/dist     statisches Vue-Build (npm run build)
#   /var/www/lokato/backend           Laravel-Source
#   php-fpm lauscht auf 127.0.0.1:9000 (siehe docker/php-fpm/lokato-pool.conf)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/lokato/frontend/dist;
    index index.html;

    client_max_body_size 8m;

    # Vue-SPA: statisches Build ausliefern. Unbekannte Pfade fallen auf
    # index.html (Hash-Routing braucht das streng genommen nicht, aber
    # wenn jemand mal History-Mode anschaltet, ist es schon korrekt).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel API + SSE
    location /api {
        fastcgi_pass   127.0.0.1:9000;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/lokato/backend/public/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;

        # SSE: nginx-seitig kein Buffering, kein chunked-Aufschub.
        # (Backend setzt zusaetzlich X-Accel-Buffering: no.)
        fastcgi_buffering         off;
        fastcgi_request_buffering off;
        fastcgi_read_timeout      75s;
    }

    # Versteckte Dateien blocken (.env, .git, ...).
    location ~ /\. {
        deny all;
    }

    # Statische Assets aggressiv cachen (Vite hashed Dateinamen sowieso).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
