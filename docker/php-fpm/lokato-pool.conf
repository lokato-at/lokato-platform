; Lokato php-fpm Pool fuer Raspberry Pi Production.
; Deployment-Pfad: /etc/php/<VERSION>/fpm/pool.d/lokato.conf
;
; Hinweis: ist die Default-www-Pool noch aktiv, blockiert die Port 9000.
; start-prod-raspi.sh deaktiviert sie via
;   mv /etc/php/<VERSION>/fpm/pool.d/www.conf{,.disabled}
; und macht danach `systemctl restart php<VERSION>-fpm`.

[lokato]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; systemd-/Shell-ENV in den Pool durchreichen (PATH etc.). Laravels .env
; wird unabhaengig davon aus der Datei /var/www/lokato/backend/.env geladen.
clear_env = no

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M
php_admin_value[max_execution_time] = 120

; SSE: kein Output-Buffering, kein gzip auf der PHP-Ebene.
php_admin_value[output_buffering] = Off
php_admin_value[implicit_flush] = On
php_admin_flag[zlib.output_compression] = Off

php_admin_value[date.timezone] = Europe/Vienna

; OPcache: in Prod ohne Timestamp-Revalidierung. Nach Deploy ist
; `systemctl reload php<VERSION>-fpm` notwendig (macht start-prod-raspi.sh).
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.max_accelerated_files] = 20000

php_admin_value[error_log] = /var/log/lokato/php-fpm.log
php_admin_flag[log_errors] = on
