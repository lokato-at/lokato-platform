; Lokato PHP-Overrides (Dev-Profil).
; Geladen via /usr/local/etc/php/conf.d/zz-lokato.ini (letzte Wins).

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 120

; SSE-relevant: Output darf nicht durch PHP gepuffert werden.
; (Der Controller ruft zusaetzlich ob_end_flush(); diese Settings sichern
; ab, dass kein zlib-/output-handler dazwischengeklemmt wird.)
output_buffering = Off
zlib.output_compression = Off
implicit_flush = On

date.timezone = Europe/Vienna

; OPcache: in Dev mit revalidate, in Prod (Pi nativ) ueberschreibt die
; Pi-Konfiguration das auf revalidate_freq=60 oder ganz aus.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
